# ================================================================
# CI Pipeline — AI Native 文档解析平台
# ================================================================
# 文档驱动来源:
#   - CODING_RULES.md → ruff lint/format + mypy 类型检查
#   - TEST_RULES.md   → pytest 单元测试 + 覆盖率
#   - ARCHITECTURE.md → Docker 多模块构建策略
#   - TECH_STACK.md   → Python 3.12, Vue 3, 中间件版本
#   - docker-compose.yml → 集成测试环境
# ================================================================
# 设计原则:
#   1. CI = Agent Gate: 所有 PR 必须通过本流水线才能合并
#   2. 文档驱动: 每项检查都可追溯至项目内文档
#   3. 逐步收紧: 先放行后严格, 随代码成熟逐步移除宽松标志
# ================================================================

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:

  # ============================================================
  # Job 1: Secret Scan
  # — 防止 AI Agent 误提交 .env / 密钥 / 凭据
  # — 来源: CODING_RULES.md §7.5 Git 规范 + 团队安全要求
  # — 阶段: 始终硬阻断
  # ============================================================
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for committed .env files
        run: |
          if git diff --name-only origin/main...HEAD | grep -qE '\.env$'; then
            echo "::error::❌ .env file detected in PR changes. Environment files must not be committed."
            exit 1
          fi
          echo "✅ No .env files in PR changes."

      - name: Scan for suspicious secret patterns
        run: |
          SUSPICIOUS=$(git diff origin/main...HEAD --diff-filter=AM -U0 2>/dev/null | \
            grep -nE '^\+.*(?:password|PASSWORD|secret|SECRET|api[_-]?key|API[_-]?KEY|auth_token|AUTH_TOKEN|private_key|PRIVATE_KEY|BEGIN RSA)' | \
            grep -vE 'EXAMPLE|changeme|example|your-' || true)
          if [ -n "$SUSPICIOUS" ]; then
            echo "::warning::⚠️ Potential secrets detected in PR diff. Please review each flagged line:"
            echo "$SUSPICIOUS"
          else
            echo "✅ No suspicious patterns detected."
          fi

  # ============================================================
  # Job 2: Python Lint & Type Check
  # — 来源: CODING_RULES.md §7.1 Python 编码规范
  # — ruff: 严格遵循 PEP 8 + Black 风格 (pyproject.toml line-length=100)
  # — mypy: 现阶段宽松模式 (continue-on-error), 后续收紧
  # ============================================================
  python-lint:
    name: Python Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy

      - name: Ruff lint check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check backend/ tests/

      - name: Mypy type check (宽松模式)
        run: mypy backend/ workers/ tests/ --ignore-missing-imports
        continue-on-error: true

  # ============================================================
  # Job 3: Unit Tests
  # — 来源: TEST_RULES.md §8.1 测试层级 + §8.3 单元测试规范
  # — 无测试文件时优雅跳过, 有测试文件且失败时阻断
  # ============================================================
  python-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Run unit tests with coverage
        run: |
          python -m pytest -m unit --cov=app --cov-report=term-missing -q \
            || if [ $? -ne 5 ]; then exit $?; fi

  # ============================================================
  # Job 4: Docker Build Verification
  # — 来源: ARCHITECTURE.md §2.6 + Dockerfile.*
  # — 验证多阶段 Dockerfile 能正常构建
  # — GPU 容器 (gpu-pytorch/gpu-paddle) 在第三层开发时加入
  # ============================================================
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build API image (dev target)
        run: |
          docker build -f Dockerfile/Dockerfile.api \
            --target dev \
            -t docparser-api:ci \
            .
          echo "✅ Dockerfile.api (dev) built successfully"

      - name: Build Frontend image
        run: |
          docker build -f Dockerfile/Dockerfile.frontend \
            -t docparser-frontend:ci \
            .
          echo "✅ Dockerfile.frontend built successfully"

  # ============================================================
  # Job 5: Frontend Check
  # — 来源: TECH_STACK.md §3.1 (Vue 3 + Vite)
  # — 条件执行: 仅 frontend/package.json 存在时运行
  # — 验证 npm install → lint → build
  # ============================================================
  frontend:
    name: Frontend Check
    runs-on: ubuntu-latest
    if: hashFiles('frontend/package.json') != ''
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint
        run: npm run lint 2>/dev/null || echo "⚠️ No lint script configured, skipping."
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

  # ============================================================
  # Job 6: Integration Test (占位)
  # — 来源: TEST_RULES.md §8.4 + docker-compose.yml
  # — 当前为占位, 后端代码到位后开放
  # — 届时启动: postgres + redis + minio → pytest -m integration
  # ============================================================
  integration-test:
    name: Integration Test (占位)
    runs-on: ubuntu-latest
    if: false
    steps:
      - uses: actions/checkout@v4

      - name: Start services
        run: docker compose up -d postgres redis minio

      - name: Wait for services
        run: |
          sleep 10
          docker compose ps

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx pytest-cov

      - name: Run integration tests
        run: python -m pytest -m integration -q

      - name: Cleanup
        if: always()
        run: docker compose down --volumes
